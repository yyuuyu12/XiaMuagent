}

/* ============================================================
   JS · 克隆流程 · API 调用
   ============================================================ */

/* ① 提取 —— 和手机端完全相同：先 clone-start，再轮询 /tasks/:id */
let _dExtractPoller = null;

// ===== 本地算力服务状态探测（离线友好降级）=====
async function dProbeServices(force) {
  if (dS.svcProbing) return;
  if (!force && dS.svcStatus && Date.now() - (dS._svcAt || 0) < 60000) return;
  dS.svcProbing = true;
  try {
    const r = await dHttp.get('/ai/services-status');
    if (r.code === 200 && r.data) { dS.svcStatus = r.data; dS._svcAt = Date.now(); }
  } catch {}
  dS.svcProbing = false;
  dRender();
}
// 操作前预检：对应服务离线则拦截。返回 true = 已拦截
function dSvcBlocked(kind) {
  if (dS.svcStatus && dS.svcStatus[kind] === 'down') {
    dToast('渲染服务维护中，请稍后再试');
    return true;
  }
  return false;
}
// 渲染服务离线提示横幅 HTML（口播工坊页用）
function dSvcBanner() {
  const s = dS.svcStatus;
  if (!s) return '';
  const down = [];
  if (s.asr === 'down') down.push('语音识别');
  if (s.tts === 'down') down.push('声音克隆');
  if (s.video === 'down') down.push('数字人');
  if (!down.length) return '';
  return `<div style="background:#FFF4E5;border:1px solid #FFD9A8;border-radius:12px;padding:12px 16px;margin-bottom:16px;color:#7A5A2E;font-size:13px;line-height:1.6"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px"><path d="M12 4L2.5 20H21.5L12 4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10.5V14.5M12 17V17.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> <b>${down.join('、')}</b>服务正在维护中，相关步骤暂时不可用，已生成的内容不受影响。请稍后再试。</div>`;
}

async function dHandleExtract() {
  if (dSvcBlocked('asr')) return;
  const url = document.getElementById('dVideoUrl')?.value?.trim() || dS.videoUrl;
  if (!url) { dToast('请输入视频链接'); return; }
  dS.videoUrl = url;
  dS.extractLoading = true; dS.extractErr = '';
  dS.extractedScript = '';
  dRender();

  const r = await dHttp.post('/video/clone-start', { url });
  if (r.code !== 200) {
    dS.extractLoading = false;
    dS.extractErr = r.msg || '提交失败';
    dRender(); return;
  }
  dS.cloneTaskId = r.data?.taskId || null;
  // 开始轮询
  _dStartExtractPoller(dS.cloneTaskId);
}

function _dStartExtractPoller(taskId) {
  if (_dExtractPoller) clearInterval(_dExtractPoller);
  _dExtractPoller = setInterval(async () => {
    try {
      const r = await dHttp.get(`/tasks/${taskId}`);
      if (r.code !== 200) return;
      const task = r.data;
      if (task.status === 'extracted' || task.status === 'done') {
        clearInterval(_dExtractPoller); _dExtractPoller = null;
        dS.extractLoading = false;
        dS.extractedScript = task.result?.transcript || '';
        // 如果已经跑完改写也一并拿到
        if (task.result?.rewritten) dS.rewrittenScript = task.result.rewritten;
        dS.extractStep = 1;
        dRender();
      } else if (task.status === 'failed') {
        clearInterval(_dExtractPoller); _dExtractPoller = null;
        dS.extractLoading = false;
        dS.extractErr = task.error_msg || '提取失败';
        dRender();
      } else if (task.status === 'paused') {
        // 渲染服务离线：保持轮询，恢复后任务会自动续跑（worker 自动 resume）
        dS.extractErr = '渲染服务离线，恢复后自动继续';
        dRender();
      }
      // pending / running 继续等
    } catch (e) { console.error('[d-extract]', e); }
  }, 2500);
}

/* ② 改写 */
async function dHandleRewrite() {
  // 从提取卡 textarea 读最新内容（用户可能手动编辑过）
  const scriptEl = document.getElementById('dExtractedScript');
  const script = scriptEl?.value?.trim() || dS.extractedScript;
  if (!script) { dToast('请先完成文案提取'); return; }
  dS.extractedScript = script;
  dS.rewriteLoading = true; dS.rewriteErr = '';
  dRender();

  // 有 cloneTaskId 时走任务改写接口（与手机端一致）
  if (dS.cloneTaskId) {
    const r = await dHttp.post(`/tasks/${dS.cloneTaskId}/start-rewrite`, { editedTranscript: script });
    dS.rewriteLoading = false;
    if (r.code !== 200) { dS.rewriteErr = r.msg || '改写失败'; dRender(); return; }
    // 轮询任务直到改写完成
    _dWaitRewrite(dS.cloneTaskId);
  } else {
    // 没有 taskId 时直接调 /ai/rewrite（手动粘贴文案的情况）
    const r = await dHttp.post('/ai/rewrite', { text: script });
    dS.rewriteLoading = false;
    if (r.code !== 200) { dS.rewriteErr = r.msg || '改写失败'; dRender(); return; }
    dS.rewrittenScript = r.data?.result || '';
    dS.extractStep = 2;
    dRender();
  }
}

function _dWaitRewrite(taskId) {
  const poller = setInterval(async () => {
    try {
      const r = await dHttp.get(`/tasks/${taskId}`);
      if (r.code !== 200) return;
      const task = r.data;
      if (task.status === 'done') {
        clearInterval(poller);
        dS.rewriteLoading = false;
        dS.rewrittenScript = task.result?.rewritten || task.result?.scripts?.[0]?.content || '';
        dS.extractStep = 2;
        dRender();
      } else if (task.status === 'failed') {
        clearInterval(poller);
        dS.rewriteLoading = false;
        dS.rewriteErr = task.error_msg || '改写失败';
        dRender();
      }
    } catch (e) { console.error('[d-rewrite]', e); }
  }, 2500);
}

/* ③ TTS —— 与手机端对齐：统一字段 voice，IndexTTS 异步轮询 */
async function dHandleTTS() {
  if (dSvcBlocked('tts')) return;
  const voiceId = document.getElementById('dTtsVoice')?.value || dS.ttsVoiceId;
  if (!voiceId) { dToast('请选择声音'); return; }
  const text = dS.rewrittenScript || dS.extractedScript;
  if (!text) { dToast('没有文案，请先完成步骤①②'); return; }

  // 清除旧音频，重置状态
  if (dS.ttsAudioUrl?.startsWith('blob:')) { try { URL.revokeObjectURL(dS.ttsAudioUrl); } catch {} }
  dS.ttsAudioUrl = null; dS.ttsAudioB64 = null;
  dS.ttsLoading = true; dS.ttsErr = ''; dS.ttsVoiceId = voiceId;
  dS.ttsProgressMsg = '正在提交...';
  dRender();

  const myVoice = dS.myVoices.find(v => v.id === voiceId);
  const payload = myVoice
    ? { text, voice: 'indextts', speed: dS.ttsSpeed, indexRefAudio: myVoice.audio_b64,
        indexEmotion: dS.ttsEmotion || 'neutral' }
    : { text, voice: voiceId, speed: dS.ttsSpeed, indexEmotion: dS.ttsEmotion || 'neutral' };

  const r = await dHttp.post('/ai/tts', payload);

  if (r.code === 202 && r.task_id) {
    // IndexTTS 异步：进入轮询
    dS.ttsProgressMsg = 'GPU 推理中，通常需要 30~120 秒...';
    dRender();
    await _dPollIndexTTS(r.task_id);
    return;
  }

  dS.ttsLoading = false; dS.ttsProgressMsg = '';
  if (r.code !== 200) { dS.ttsErr = r.msg || '语音合成失败'; dRender(); return; }
  _dApplyTTSAudio(r.data);
}

// IndexTTS 轮询（每2秒，最多4分钟）
async function _dPollIndexTTS(taskId) {
  const start = Date.now();
  for (let i = 0; i < 120; i++) {
    await new Promise(res => setTimeout(res, 2000));
    const elapsed = Math.round((Date.now() - start) / 1000);
    dS.ttsProgressMsg = `GPU 推理中... 已等待 ${elapsed} 秒`;
    _dUpdateTTSProgress();
    try {
      const r = await dHttp.get(`/ai/tts/indextts/task/${taskId}`);
      if (r.code === 200 && r.data?.status === 'done') {
        dS.ttsLoading = false; dS.ttsProgressMsg = '';
        _dApplyTTSAudio(r.data); return;
      }
      if (r.data?.status === 'error') {
        dS.ttsLoading = false; dS.ttsProgressMsg = '';
        dS.ttsErr = r.data.error || 'IndexTTS 推理失败'; dRender(); return;
      }
    } catch(e) { console.error('[d-tts-poll]', e); }
  }
  dS.ttsLoading = false; dS.ttsProgressMsg = '';
  dS.ttsErr = '语音合成超时（超过4分钟）'; dRender();
}

function _dUpdateTTSProgress() {
  const el = document.getElementById('dTtsProgressMsg');
  if (el) el.textContent = dS.ttsProgressMsg;
}

// 统一处理 TTS 音频结果（后端所有通道都返回 data.audio）
function _dApplyTTSAudio(data) {
  const b64 = data?.audio;
  if (b64) {
    dS.ttsAudioB64 = b64;
    try {
      const raw = atob(b64); const buf = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
      dS.ttsAudioUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/mp3' }));
    } catch(e) { dS.ttsErr = '音频解码失败'; }
  } else if (data?.audio_url) {
    dS.ttsAudioUrl = data.audio_url;
  }
  dS.extractStep = 3;
  dRender();
}

/* ④ 数字人 · 形象库管理 */

// 生成缩略图（canvas 抓首帧）
async function _dGenAvatarThumb(blobUrl) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.muted = true; v.preload = 'auto'; v.src = blobUrl;
    const done = u => { try { v.src = ''; } catch {} resolve(u); };
    const tid = setTimeout(() => done(null), 5000);
    v.addEventListener('seeked', () => {
      clearTimeout(tid);
      try {
        const c = document.createElement('canvas'); c.width = 60; c.height = 107;
        c.getContext('2d').drawImage(v, 0, 0, 60, 107);
        done(c.toDataURL('image/jpeg', 0.7));
      } catch { done(null); }
    }, {once: true});
    v.addEventListener('loadeddata', () => { try { v.currentTime = 0.1; } catch {} }, {once: true});
    v.addEventListener('error', () => { clearTimeout(tid); done(null); }, {once: true});
    v.load();
  });
}

// 保存形象库元数据到 localStorage（不含 b64/blob）
function _dSaveAvatarMeta() {
  try {
    const meta = dS.avatarList.map(a => ({ id:a.id, name:a.name, size:a.size, dur:a.dur, w:a.w, h:a.h }));
    localStorage.setItem('xm_avatar_list_meta', JSON.stringify(meta));
  } catch {}
}

// 上传新形象（供④卡片下拉使用，与管理页 dHandleAvatarAdd 区分）
async function dAvatarPickerAdd(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  event.target.value = '';

  const id = 'av_' + Date.now();
  const blobUrl = URL.createObjectURL(file);
  const fmt = file.name.toLowerCase().endsWith('.mov') ? 'mov' : 'mp4';

  // 读取视频元数据
  const meta = await new Promise(resolve => {
    const v = document.createElement('video');
    v.muted = true; v.preload = 'metadata'; v.src = blobUrl;
    const tid = setTimeout(() => resolve({dur:0,w:0,h:0}), 4000);
    v.addEventListener('loadedmetadata', () => {
      clearTimeout(tid);
      resolve({ dur: Math.round(v.duration||0), w: v.videoWidth||0, h: v.videoHeight||0 });
    }, {once:true});
    v.addEventListener('error', () => { clearTimeout(tid); resolve({dur:0,w:0,h:0}); }, {once:true});
    v.load();
  });

  // 生成缩略图
  const thumb = await _dGenAvatarThumb(blobUrl);

  // 读取 base64
  const b64 = await new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const arr = new Uint8Array(e.target.result);
      let bin = ''; arr.forEach(b => bin += String.fromCharCode(b));
      resolve(btoa(bin));
    };
    reader.readAsArrayBuffer(file);
  });

  const entry = {
    id, name: file.name, fmt, blobUrl, b64, thumb,
    size: (file.size / 1024 / 1024).toFixed(1) + ' MB',
    dur: meta.dur, w: meta.w, h: meta.h, needsReupload: false
  };
  dS.avatarList = [...dS.avatarList.filter(a => a.id !== id), entry];
  _dSaveAvatarMeta();
  dSelectAvatar(id);
  dS.avatarPickerOpen = false;
  dRender();
  dToast('形象已添加 ✓');
}

// 选择形象
function dSelectAvatar(id) {
  const entry = dS.avatarList.find(a => a.id === id);
  if (!entry) return;
  if (entry.needsReupload) { dToast('该形象需要重新上传视频文件'); return; }
  dS.avatarSelectedId  = id;
  dS.avatarSrcBlobUrl  = entry.blobUrl;
  dS.avatarSrcVideoB64 = entry.b64;
  dS.avatarSrcVideoFmt = entry.fmt;
  dS.avatarSrcVideoName= entry.name;
  dS.avatarPickerOpen  = false;
  dRender();
}

// 删除④卡片形象列表中的条目（与管理页 dDeleteAvatar(idx) 区分）
function dAvatarPickerDelete(id, e) {
  e.stopPropagation();
  if (!confirm('删除这个形象吗？')) return;
  try { const a = dS.avatarList.find(x=>x.id===id); if(a?.blobUrl) URL.revokeObjectURL(a.blobUrl); } catch {}
  dS.avatarList = dS.avatarList.filter(a => a.id !== id);
  _dSaveAvatarMeta();
  if (dS.avatarSelectedId === id) {
    const first = dS.avatarList.find(a => !a.needsReupload);
    if (first) dSelectAvatar(first.id);
    else { dS.avatarSelectedId=null; dS.avatarSrcBlobUrl=null; dS.avatarSrcVideoB64=null; dS.avatarSrcVideoName=''; }
  }
  dRender();
}

// 切换下拉开关
function dToggleAvatarPicker() {
  dS.avatarPickerOpen = !dS.avatarPickerOpen;
  dRender();
  if (dS.avatarPickerOpen) {
    setTimeout(() => {
      const handler = e => {
        if (!document.querySelector('[data-avatar-picker]')?.contains(e.target)) {
          dS.avatarPickerOpen = false; dRender();
          document.removeEventListener('click', handler);
        }
      };
      document.addEventListener('click', handler);
    }, 0);
  }
}

/* ④ 数字人 · 提交生成 */
let _dAvatarPoller = null;
let _dAvatarRunSeq = 0;

async function dHandleAvatarGenerate() {
  if (dSvcBlocked('video')) return;
  if (!dS.avatarSrcBlobUrl) { dToast('请先上传参考视频'); return; }
  if (!dS.avatarSrcVideoB64) { dToast('视频正在加载中，请稍等…'); return; }
  if (!dS.ttsAudioB64 && !dS.ttsAudioUrl) { dToast('请先完成语音合成（步骤③）'); return; }

  // 若 TTS 只有 blob/URL 没有 b64，先抓取转换
  let audioB64 = dS.ttsAudioB64;
  if (!audioB64 && dS.ttsAudioUrl) {
    try {
      dToast('正在准备音频数据...', 3000);
      const resp = await fetch(dS.ttsAudioUrl);
      const ab = await resp.arrayBuffer();
      const bytes = new Uint8Array(ab);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      audioB64 = btoa(bin);
      dS.ttsAudioB64 = audioB64; // 缓存
    } catch(e) {
      dToast('音频准备失败，请重新合成语音'); return;
    }
  }

  dS.avatarGenerating = true; dS.avatarErr = '';
  dS.avatarProgressMsg = '正在提交任务...'; dS.avatarProgressPct = 10;
  dS.extractStep = 'avatar_gen';
  dRender();

  const body = {
    video_b64: dS.avatarSrcVideoB64,
    video_fmt: dS.avatarSrcVideoFmt || 'mp4',
    audio_b64: audioB64,
    audio_fmt: 'mp3',
    enhancer: dS.avatarBeauty,
  };

  const r = await dHttp.post('/ai/video/generate', body);
  if (r.code !== 200) {
    dS.avatarGenerating = false; dS.avatarErr = r.msg || '提交失败';
    dS.extractStep = 3; dRender(); return;
  }
  const taskId = r.data?.task_id;
  dS.avatarTaskId = taskId;
  dS.avatarProgressMsg = '任务已提交，等待 GPU 渲染...';
  dS.avatarProgressPct = 20;
  dRender();
  _dAvatarRunSeq++;
  _dStartAvatarPoller(taskId, _dAvatarRunSeq);
}

function _dStartAvatarPoller(taskId, runSeq) {
  if (_dAvatarPoller) clearInterval(_dAvatarPoller);
  let elapsed = 0;
  let inFlight = false;
  _dAvatarPoller = setInterval(async () => {
    if (runSeq !== _dAvatarRunSeq) { clearInterval(_dAvatarPoller); return; }
    if (inFlight) return;
    inFlight = true; elapsed += 10;
    try {
      const r = await dHttp.get(`/ai/video/task/${taskId}`);
      if (r.code !== 200) { inFlight = false; return; }
      const t = r.data;
      const pct = Math.min(90, 20 + elapsed * 0.5);
      dS.avatarProgressPct = pct;
      dS.avatarProgressMsg = t.msg || '处理中...';
      _dUpdateAvatarProgress();
      if (t.status === 'done') {
        clearInterval(_dAvatarPoller); _dAvatarPoller = null;
        dS.avatarProgressMsg = '生成完成！'; dS.avatarProgressPct = 100;
        _dUpdateAvatarProgress();
        // 使用本地后端代理流式地址（避免 CORS 问题，不直连 HeyGem）
        // location.origin 在桌面 exe 里是 http://127.0.0.1:9101，Zeabur 是 https://...
        const proxyVideoUrl = `${location.origin}/api/ai/video/stream/${taskId}`;
        if (dS.avatarVideoUrl?.startsWith('blob:')) { try { URL.revokeObjectURL(dS.avatarVideoUrl); } catch {} }
        dS.avatarVideoUrl = proxyVideoUrl;  // 直接用代理 URL，video 标签支持流式
        dS.avatarGenerating = false; dS.extractStep = 4;
        dRender();
      } else if (t.status === 'error') {
        clearInterval(_dAvatarPoller);
        dS.avatarGenerating = false; dS.avatarErr = t.error || '生成失败';
        dS.extractStep = 3; dRender();
      }
    } catch(e) {
      console.error('[d-avatar]', e);
    } finally { inFlight = false; }
  }, 10000);
}

function _dUpdateAvatarProgress() {
  // 兼容新 scard 结构
  const fillEl = document.querySelector('#dMainContent .d-progress-fill');
  if (fillEl) fillEl.style.width = dS.avatarProgressPct + '%';
  // 更新进度文字
  const msgEls = document.querySelectorAll('#dMainContent .scard-body [data-avatar-msg]');

/* ============================================================
   JS · 任务列表页 (dRenderTasks)
   ============================================================ */
const STEP_LABELS = ['提取','改写','语音','数字人','后期','发布'];

function dRenderTasks() {
  const filter = dS.taskFilter || 'all';
  const allTasks = dS.tasks;

  // filter tasks
  const filteredTasks = filter === 'all' ? allTasks
    : filter === 'active' ? allTasks.filter(t => { const steps = dTaskSteps(t); return steps.some(s=>s!=='done'); })
    : allTasks.filter(t => { const steps = dTaskSteps(t); return steps.every(s=>s==='done'); });

  const rows = filteredTasks.length === 0
    ? `<tr><td colspan="4" style="text-align:center;padding:40px;color:#B0AA9F;font-size:13px">
        ${dS.tasksLoaded ? (filter==='all'?'暂无任务，去克隆第一条视频吧':'暂无符合条件的任务') : '加载中...'}
       </td></tr>`
    : filteredTasks.map(t => {
        const steps = dTaskSteps(t);
        const cur = steps.findIndex(s => s !== 'done');
        const isPaused = t.status === 'paused';
        const nextLabel = isPaused ? '等待服务恢复' : (cur >= 0 ? `去${STEP_LABELS[cur]}` : '已完成');
        const nextColor = isPaused ? '#B0860B' : (cur >= 0 ? '#F5762A' : '#22C55E');
        return `
        <tr onclick="dOpenTask('${t.id}')" style="cursor:pointer">
          <td><div style="font-size:13px;font-weight:500;color:#1A1614;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title || t.videoTitle || '无标题')}</div></td>
          <td><div style="font-size:12px;color:#B0AA9F;white-space:nowrap">${dFmtTime(t.createdAt || t.created_at)}</div></td>
          <td>
            <div class="d-dots">
              ${steps.map((s,i) => `
                <div class="d-dot ${s}">${s==='done'?'<svg width="8" height="8" viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':`<span style="font-size:8px">${i+1}</span>`}</div>
                ${i < steps.length-1 ? `<div class="d-dot-line ${s==='done'?'done':''}"></div>` : ''}
              `).join('')}
            </div>
          </td>
          <td style="text-align:right;padding-right:20px">
            <span style="font-size:12px;font-weight:600;color:${nextColor}">${nextLabel} ${cur>=0?'›':''}</span>
          </td>
        </tr>`;
      }).join('');

  const filterTabs = ['all','active','done'].map((f,_,arr) => {
    const labels = {all:`全部 (${allTasks.length})`, active:'进行中', done:'已完成'};
    return `<div class="filter-tab ${filter===f?'active':''}" onclick="dS.taskFilter='${f}';dRender()">${labels[f]}</div>`;
  }).join('');

  return `
  <div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-size:15px;font-weight:700;color:#1A1614">任务列表</div>
        <div style="font-size:12px;color:#9E9890;margin-top:3px">保存的克隆流程，随时继续</div>
      </div>
      <button class="b b-sm b-primary" onclick="dGoPage('home')" style="gap:5px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        新建克隆
      </button>
    </div>
    <div class="d-card">
      <div style="padding:12px 16px;border-bottom:1px solid #F7F5F1;display:flex;align-items:center;gap:0">
        <div class="filter-tabs">${filterTabs}</div>
      </div>
      <table class="d-table">
        <thead>
          <tr>
            <th style="width:42%">任务标题</th>
            <th style="width:16%">创建时间</th>
            <th style="width:30%">进度</th>
            <th style="width:12%;text-align:right;padding-right:20px">操作</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function dTaskSteps(t) {
  // 根据任务数据推断各步骤状态
  const has = field => t[field] != null && t[field] !== '';
  return [
    has('videoTitle') || has('script') ? 'done' : 'idle',
    has('rewritten') ? 'done' : 'idle',
    has('audioUrl') || has('ttsAudio') ? 'done' : 'idle',
    has('videoUrl') || has('avatarVideo') ? 'done' : 'idle',
    has('finalVideo') ? 'done' : 'idle',
    'idle',
  ];
}

function dFmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  if (isNaN(d)) return ts;
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function dOpenTask(id) {
  dToast('正在恢复任务...');
  // TODO: 恢复任务状态后跳转克隆流程
}

async function dBindTasks() {
  if (!dS.tasksLoaded) {
    const r = await dHttp.get('/history');
    if (r.code === 200) {
      dS.tasks = r.data || [];
      dS.tasksLoaded = true;
      dRender(); // 重新渲染带数据的版本
    }
  }
}

let _dVoiceFileB64 = null;
let _dVoiceFileName = '';

function dOnVoiceFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  _dVoiceFileName = file.name;
  document.getElementById('dVoiceFileLabel').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => { _dVoiceFileB64 = e.target.result.split(',')[1]; };
  reader.readAsDataURL(file);
}

// 直接保存到本地（IndexTTS 用 audio_b64 作为参考音频，无需上传 API）
function dHandleVoiceClone() {
  const name = document.getElementById('dVoiceCloneName')?.value?.trim() || dS.voiceCloneName;
  if (!name) { dToast('请先输入声音名称'); return; }
  if (!_dVoiceFileB64) { dToast('请先选择音频文件'); return; }
  const id = Date.now().toString();
  const newVoice = { id, name, audio_b64: _dVoiceFileB64, createdAt: new Date().toISOString() };
  dS.myVoices = [...dS.myVoices, newVoice];
  localStorage.setItem('myVoices', JSON.stringify(dS.myVoices));
  dS.voiceCloneName = ''; _dVoiceFileB64 = null; _dVoiceFileName = '';
  dToast('声音已保存，可在合成步骤中使用');
  dRender();
}

function dDeleteVoice(idx) {
  if (!confirm('确认删除这个克隆声音？')) return;
  dS.myVoices = dS.myVoices.filter((_, i) => i !== idx);
  localStorage.setItem('myVoices', JSON.stringify(dS.myVoices));
  dRender();
}

  dS.ttsVoiceId = id;

let _dAddAvatarB64 = null;
let _dAddAvatarFmt = 'mp4';
let _dAddAvatarName = '';
let _dAddAvatarBlobUrl = null;

function dOnAvatarAddSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  _dAddAvatarFmt = (file.name.split('.').pop() || 'mp4').toLowerCase();
  _dAddAvatarName = file.name;

  // 更新选择标签文字
  const label = document.getElementById('dAvatarAddVideoLabel');
  if (label) label.textContent = file.name;

  // 释放旧 blob
  if (_dAddAvatarBlobUrl) { try { URL.revokeObjectURL(_dAddAvatarBlobUrl); } catch {} }
  _dAddAvatarBlobUrl = URL.createObjectURL(file);

  // 显示视频预览（不触发 dRender 以保留文件输入状态）
  const preview  = document.getElementById('dAvatarAddPreview');
  const videoEl  = document.getElementById('dAvatarAddPreviewVideo');
  const labelBox = document.getElementById('dAvatarAddLabel');
  if (preview && videoEl) {
    videoEl.src = _dAddAvatarBlobUrl;
    preview.style.display = 'block';
    // 选中状态：边框变实线橙色
    if (labelBox) { labelBox.style.borderStyle = 'solid'; labelBox.style.borderColor = '#F5762A'; }
  }

  // 异步读 base64
  _dAddAvatarB64 = null;
  const reader = new FileReader();
  reader.onload = e => { _dAddAvatarB64 = e.target.result.split(',')[1]; };
  reader.readAsDataURL(file);
}

function _dClearAvatarAddPreview() {
  if (_dAddAvatarBlobUrl) { try { URL.revokeObjectURL(_dAddAvatarBlobUrl); } catch {} _dAddAvatarBlobUrl = null; }
  _dAddAvatarB64 = null; _dAddAvatarName = '';
  const preview  = document.getElementById('dAvatarAddPreview');
  const videoEl  = document.getElementById('dAvatarAddPreviewVideo');
  const label    = document.getElementById('dAvatarAddVideoLabel');
  const labelBox = document.getElementById('dAvatarAddLabel');
  const input    = document.getElementById('dAvatarAddInput');
  if (preview)  preview.style.display = 'none';
  if (videoEl)  videoEl.src = '';
  if (label)    label.textContent = '选择参考视频';
  if (labelBox) { labelBox.style.borderStyle = 'dashed'; labelBox.style.borderColor = '#D4D0C8'; }
  if (input)    input.value = '';
}

function dHandleAvatarAdd() {
  const name = document.getElementById('dAvatarAddName')?.value?.trim() || dS.avatarAddName;
  if (!name) { dToast('请填写形象名称'); return; }
  if (!_dAddAvatarB64) { dToast('请先选择参考视频'); return; }
  const newAvatar = {
    id: Date.now().toString(),
    name,
    videoB64: _dAddAvatarB64,
    fmt: _dAddAvatarFmt,
    fileName: _dAddAvatarName,
    createdAt: new Date().toISOString(),
  };
  dS.myAvatars = [...dS.myAvatars, newAvatar];
  localStorage.setItem('myAvatars', JSON.stringify(dS.myAvatars));
  _dClearAvatarAddPreview();
  dS.avatarAddName = '';
  dToast('形象已保存！');
  dRender();
}

function dDeleteAvatar(idx) {
  if (!confirm('确认删除这个数字人形象？')) return;
  dS.myAvatars = dS.myAvatars.filter((_, i) => i !== idx);
  localStorage.setItem('myAvatars', JSON.stringify(dS.myAvatars));
  dRender();
}

function dUseAvatarInClone(idx) {
  const a = dS.myAvatars[idx];
  if (!a) return;
  dS.avatarSrcVideoB64 = a.videoB64;
  dS.avatarSrcVideoFmt = a.fmt || 'mp4';
  dS.avatarSrcVideoName = a.name;
  dToast(`已选择形象「${a.name}」，前往克隆流程使用`);
  dGoPage('home');
}

async function dSubmitAuthCode() {
  const code = document.getElementById('dAuthCodeInput')?.value?.trim();
  if (!code) { dToast('请输入授权码'); return; }
  const r = await dHttp.post('/auth/activate-code', { code });
  const msgEl = document.getElementById('dAuthCodeMsg');
  if (r.code === 200) {
    if (msgEl) { msgEl.textContent = '授权成功！'; msgEl.style.display = ''; msgEl.style.color = '#22C55E'; }
    dToast('授权成功');
    // 刷新用户信息
    const mr = await dHttp.get('/auth/me');
    if (mr.code === 200) { dS.userInfo = mr.data; dRender(); }
  } else {
    if (msgEl) { msgEl.textContent = r.msg || '授权失败'; msgEl.style.display = ''; msgEl.style.color = '#E5534B'; }
  }
}

function dLogout() {
  if (!confirm('确认退出登录？')) return;
  dClearAuth();
  dS.userInfo = null;
  dShowLogin();
}

function oSkillStats(sk){

/* ---------- Markdown 渲染（Skill 阅读模式）---------- */
function dOMarkdownHtml(text){
  if(!(text||'').trim()) return '<div style="padding:36px 0;color:#C0B8B0;font-size:13px;text-align:center;line-height:2.2">暂无内容<br><span style="font-size:12px">点右上角「编辑」，用 Markdown 格式写你的 Skill 笔记</span></div>';
  let html=''; let inList=false;

  for(let i=0;i<lines.length;i++){
    const line=lines[i];

      if(inList){html+='</div>';inList=false;}
      html+=`<div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#1A1614;margin:${i>0?'22px':'4px'} 0 9px;padding-bottom:7px;border-bottom:1.5px solid #F0EDE8"><span style="width:3px;height:14px;background:linear-gradient(180deg,#FF8040,#F5602A);border-radius:2px;flex-shrink:0;display:inline-block"></span>${esc(line.slice(3))}</div>`;
    } else if(line.startsWith('# ')){
      if(inList){html+='</div>';inList=false;}
      html+=`<div style="font-size:16px;font-weight:700;color:#1A1614;margin:${i>0?'24px':'4px'} 0 12px">${esc(line.slice(2))}</div>`;
    } else if(line.startsWith('- ')){
      if(!inList){html+='<div style="display:flex;flex-direction:column;gap:0">'; inList=true;}
      html+=`<div style="display:flex;align-items:flex-start;gap:9px;padding:5px 0 5px 4px;font-size:13.5px;color:#2A241E;line-height:1.7;border-bottom:1px dashed #F5EFE8"><span style="color:#F5762A;font-size:18px;line-height:1.2;flex-shrink:0;margin-top:0px">•</span><span>${esc(line.slice(2))}</span></div>`;
    } else if(line.trim()===''){
      if(inList){html+='</div>';inList=false;}
      html+='<div style="height:8px"></div>';
    } else {
      if(inList){html+='</div>';inList=false;}
      html+=`<div style="font-size:13.5px;color:#6E6860;line-height:1.7;padding:2px 0">${esc(line)}</div>`;
    }
  }
  if(inList) html+='</div>';
  return html;
}
/* ---------- 日期分组（首页项目列表）---------- */
function dOGroupByDate(projs){
  if(!projs||!projs.length) return [];
  const now=new Date(); now.setHours(0,0,0,0);
  const yest=new Date(now); yest.setDate(now.getDate()-1);
  const map=new Map();
  for(const p of projs){
    const d=new Date(p.updated_at||p.created_at||Date.now()); d.setHours(0,0,0,0);
    let key;
    if(+d>=+now) key='今天';
    else if(+d>=+yest) key='昨天';
    else{ const diff=Math.round((+now-+d)/86400000); key=diff<7?`${diff}天前`:`${d.getMonth()+1}月${d.getDate()}日`; }
    if(!map.has(key)) map.set(key,[]);
    map.get(key).push(p);
  }
  return [...map.entries()];
}

/* ---------- 打开项目 ---------- */
async function dOOpenProject(id){
  if(dS.oProjectLoading) return; // 防止重复点击发起多个并发请求
  dS.oProjectLoading = true;
  // 立刻从本地缓存中找项目数据，秒跳工作台（不等 API）
  const cached = (dS.oProjects||[]).find(p=>p.id===id);
  dS.oProject = cached ? {...cached, artifacts:{}} : {id, title:'加载中…', stage:'script', artifacts:{}};
  dS.oMessages = []; dS.oBound = [];
  dS.oRight = 'doc'; dS.oInput = ''; dS.oView = 'workspace';
  dS.oActiveStage = cached ? (cached.stage || 'script') : 'script'; // 默认操作当前阶段
  dRender(); dOScrollChat(); // 立即进入工作台，用户不会感知等待
  // 后台拉取完整数据（消息记录、绑定素材等）
  const r = await dHttp.get('/original/projects/'+id);
  dS.oProjectLoading = false;
  if(r.code!==200){ dToast(r.msg||'加载失败'); return; }
  dS.oProject = r.data.project || null;
  if(dS.oProject){ dS.oProject.artifacts = dS.oProject.artifacts || {}; dS.oActiveStage = dS.oProject.stage || 'script'; }
  dS.oMessages = r.data.messages || [];
  dS.oBound = r.data.boundMaterials || [];
  if(dS.oView==='workspace') { dRender(); dOScrollChat(); }
}

  const statusBadge = isFinal

  const breadcrumb = `
    <div style="background:#fff;border:1px solid rgba(0,0,0,0.05);border-radius:12px;padding:9px 18px;margin-bottom:10px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,0.04);flex-shrink:0">
      <div onclick="dOBackHome()" class="hov-back-btn" title="返回项目列表" style="width:30px;height:30px;border-radius:9px;background:#F7F5F1;border:1px solid #EDE9E3;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#6E6860" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span style="font-size:13.5px;font-weight:700;color:#1A1614;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px">${esc(titleShort)}</span>
      ${statusBadge}

    </div>`;

  return `
    ${breadcrumb}
    <div class="do-ws" style="height:calc(100vh - 150px)">${navCol}${chatCol}${rightCol}</div>
    ${dS.oSkillQuickModal?dOQuickModalHtml():''}${dS.oPackEdit?dOPackModalHtml():''}`;
}

        ? `<div class="do-empty">素材库还没有素材。在手机端「素材库」提取爆款原文后，这里就能选来对标。</div>`
        : dS.oMaterials.map(m=>{
            const on = boundIds.includes(m.id);
            return `<div class="do-mat-row ${on?'bound':''}" onclick="dOToggleBench(${m.id})" style="cursor:pointer">
              <div class="do-mat-check ${on?'on':''}">${on?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>

    ? `<div style="font-size:12px;color:#B0AA9F">暂无沉淀规则。在项目对话里写作时，创作助手会自动提炼并询问是否沉淀。</div>`

        <div style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;color:#F5762A;margin-bottom:5px">${esc(cat)}</div>
        ${(Array.isArray(arr)?arr:[]).map(r=>`<div style="font-size:12.5px;color:#2A241E;line-height:1.6;padding:5px 0;border-bottom:1px dashed #F0EDE8">· ${esc(r.text||r)}</div>`).join('')}</div>`).join('');

    <div class="do-col-head"><div><div class="do-col-h-title">我的 Skill</div><div class="do-col-h-sub">${esc(sk.version||'v1.0')} · 写作时自动遵循</div></div><div style="display:flex;gap:8px"><button class="do-btn do-btn-gho" style="padding:6px 12px;font-size:12px" onclick="dOQuickOpen()">＋ 快速记</button><span class="do-link" onclick="dOSetView('skill')">完整编辑 ›</span></div></div>
    <div class="do-col-body">
      <div style="font-size:13px;font-weight:700;color:#1A1614;margin-bottom:8px">风格规则</div>

      <div style="font-size:13px;font-weight:700;color:#1A1614;margin:16px 0 8px">高频词</div>
      <div>${(sk.keywords||[]).length?(sk.keywords||[]).map(k=>`<span class="do-chip">${esc(k)}</span>`).join(''):'<span style="font-size:12px;color:#B0AA9F">暂无</span>'}</div>
      <div style="font-size:13px;font-weight:700;color:#1A1614;margin:16px 0 8px">禁区词</div>
      <div>${(sk.forbidden||[]).length?(sk.forbidden||[]).map(k=>`<span class="do-chip" style="background:#FEF2F2;color:#DC2626">${esc(k)}</span>`).join(''):'<span style="font-size:12px;color:#B0AA9F">暂无</span>'}</div>
      ${(sk.freeText||'').trim()?`<div style="font-size:13px;font-weight:700;color:#1A1614;margin:16px 0 8px">自由笔记</div><div style="font-size:12.5px;color:#2A241E;line-height:1.7;white-space:pre-wrap;background:#F7F5F1;border-radius:10px;padding:12px 14px">${esc(sk.freeText)}</div>`:''}

function dOInfoPanel(p){
  const meta = p.meta || {};
  if(!dS.oPacksLoaded){ dS.oPacksLoaded = true; dOLoadPacks(); }
  const row = (k,v)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F2EFEA;font-size:13px"><span style="color:#9E9890">${k}</span><span style="color:#1A1614;font-weight:600">${esc(v||'—')}</span></div>`;
  const curPackId = parseInt(meta.packId)||0;
  const packOpts = ['<option value="0">不挂载（只用全局 Skill）</option>']
    .concat((dS.oPacks||[]).map(pk=>`<option value="${pk.id}" ${pk.id===curPackId?'selected':''}>${esc(pk.name)}</option>`)).join('');
  const packBlock = `
    <div style="margin-top:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:13px;font-weight:700;color:#1A1614">题材包</span>
        <span class="do-link" style="font-size:12px" onclick="dOOpenPackEdit(null)">+ 新建</span>
      </div>
      <select class="sel" onchange="dOMountPack(this.value)" style="margin-bottom:8px">${packOpts}</select>
      ${curPackId && (dS.oPacks||[]).some(pk=>pk.id===curPackId)
        ? `<div style="display:flex;gap:8px;margin-bottom:8px">
            <button class="do-btn do-btn-gho" style="flex:1;padding:6px;font-size:12px" onclick="dOOpenPackEdit(${curPackId})">编辑此包</button>
           </div>` : ''}
      <div style="font-size:11.5px;color:#B0AA9F;line-height:1.6">不同题材用不同规则包：讲 AI 工具和讲二手包的爆款套路不一样。挂载后，本项目写作时会注入该包的规则（优先级高于全局 Skill）。</div>
    </div>`;
  return `<div class="do-col">
    <div class="do-col-head"><div class="do-col-h-title">项目简介</div></div>
    <div class="do-col-body">
      <div style="font-size:16px;font-weight:700;color:#1A1614;margin-bottom:6px">${esc(p.title||'未命名项目')}</div>
      <div style="font-size:13px;color:#6E6860;line-height:1.7;margin-bottom:14px">${esc(p.brief||'（无简介）')}</div>
      ${row('当前阶段', p.status==='final'?'已定稿':oStageName(p.stage||'script'))}
      ${row('对话轮数', String(p.turns||0))}
      ${row('时长定位', meta.duration||'—')}
      ${row('平台', meta.platform||'—')}
      ${row('风格', meta.style||'—')}
      ${packBlock}
    </div>
  </div>`;
}

/* ---------- 题材包：加载/挂载/编辑 ---------- */
async function dOLoadPacks(){
  const r = await dHttp.get('/original/packs');
  if(r.code===200){ dS.oPacks = r.data||[]; dS.oSkillList=null; dRender(); }
}
async function dOMountPack(packId){
  if(!dS.oProject) return;
  const r = await dApi('PATCH','/original/projects/'+dS.oProject.id, { packId: parseInt(packId)||0 });
  if(r.code===200){
    dS.oProject.meta = dS.oProject.meta||{};
    dS.oProject.meta.packId = parseInt(packId)||0;
    dToast(parseInt(packId)?'已挂载题材包':'已卸载题材包');
  } else dToast(r.msg||'操作失败');
  dRender();
}
function dOOpenPackEdit(id){
  if(id){
    const pk = (dS.oPacks||[]).find(x=>x.id===id);
    if(!pk) return;
    dS.oPackEdit = { id: pk.id, name: pk.name||'', content: pk.content||'' };
  } else {
    dS.oPackEdit = { id: null, name: '', content: '## 人群与痛点\n- \n\n## 这个题材的爆款钩子\n- \n\n## 行业黑话与说法\n- \n\n## 禁忌\n- ' };
  }
  dRender();
}
async function dOSavePack(){
  const pe = dS.oPackEdit;
  if(!pe) return;
  const nameEl = document.getElementById('dPackName');
  const contentEl = document.getElementById('dPackContent');
  const name = nameEl ? nameEl.value : pe.name;
  const content = contentEl ? contentEl.value : pe.content;
  if(!name.trim()){ dToast('请填写题材包名称'); return; }
  const r = pe.id
    ? await dApi('PUT','/original/packs/'+pe.id, { name, content })
    : await dHttp.post('/original/packs', { name, content });
  if(r.code===200){
    dToast('已保存');
    dS.oPackEdit = null;
    const newId = (!pe.id && r.data && r.data.id) ? r.data.id : null;
    await dOLoadPacks();
    if(newId) dOMountPack(newId); // 新建的包直接挂到当前项目
  } else dToast(r.msg||'保存失败');
  dRender();
}
async function dODeletePack(){
  const pe = dS.oPackEdit;
  if(!pe || !pe.id) return;
  if(!confirm('删除题材包「'+pe.name+'」？挂载它的项目会回落到全局 Skill。')) return;
  const r = await dApi('DELETE','/original/packs/'+pe.id, {});
  if(r.code===200){
    dToast('已删除');
    if(dS.oProject && dS.oProject.meta && parseInt(dS.oProject.meta.packId)===pe.id) dS.oProject.meta.packId = 0;
    dS.oPackEdit = null;
    await dOLoadPacks();
  } else dToast(r.msg||'删除失败');
  dRender();
}
async function dODeletePackById(packId){
  const pk = (dS.oPacks||[]).find(x=>x.id===packId);
  if(!pk) return;
  if(!confirm('删除题材包「'+(pk.name||'')+'」？挂载它的项目会回落到全局 Skill。')) return;
  const r = await dApi('DELETE','/original/packs/'+packId, {});
  if(r.code===200){
    dToast('已删除');
    if(dS.oProject && dS.oProject.meta && parseInt(dS.oProject.meta.packId)===packId) dS.oProject.meta.packId = 0;

/* ---------- 对话 / 阶段 / 保存 ---------- */
function dOQuick(text){ dS.oInput = text; dOSendMsg(); }
async function dOSendMsg(){
  const v = (dS.oInput||'').trim();
  if(!v || dS.oBusy || !dS.oProject) return;
  dS.oMessages.push({ role:'user', content:v });
  dS.oInput=''; dS.oBusy=true; dRender(); dOScrollChat();
  // 传递 activeStage：null=自由聊天，stage key=AI 操作该阶段
  const payload = { message: v, activeStage: dS.oActiveStage };
  const r = await dHttp.post('/original/projects/'+dS.oProject.id+'/chat', payload);
  dS.oBusy=false;
  if(r.code===200){
    dS.oMessages.push(r.data.message);
    if(r.data.artifactKey){
      // 历史阶段编辑 → 更新对应快照，不动活文档
      dS.oProject.artifacts = dS.oProject.artifacts || {};
      dS.oProject.artifacts[r.data.artifactKey] = r.data.artifactContent || '';
    } else if(r.data.doc !== undefined){
      dS.oProject.doc = r.data.doc;
    }
    dS.oProject.turns = r.data.turns;
    dS.oProject.stage = r.data.stage || dS.oProject.stage;
  } else {
    dToast(r.msg||'生成失败，请重试');
  }
  dRender(); dOScrollChat();
}
function dOExportDoc(){
  const p = dS.oProject;
  if(!p) return;
  const content = (p.doc||'').trim() || '（无内容）';
  const title = (p.title||'口播剧本').replace(/[/\\:*?"<>|]/g,'_');
  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = title + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  dToast('已导出');
}
function dOSkillHistoryFromDoc(){
  // 打开 Skill 历史记录弹窗（复用已有逻辑）
  dS.oSkillHistoryOpen = true; dRender();
}
async function dOSaveDoc(silent){
  if(!dS.oProject) return;
  dS.oSaving=true; if(!silent) dRender();
  const r = await dApi('PATCH','/original/projects/'+dS.oProject.id, { doc: dS.oProject.doc||'' });
  dS.oSaving=false;
  if(!silent){ dToast(r.code===200?'已保存':(r.msg||'保存失败')); dRender(); }
}
async function dOAdvance(){
  if(dS.oStageBusy || !dS.oProject) return;
  const stage = dS.oProject.stage || 'script';
  const isLast = stage==='script';
  if(!isLast && !(dS.oProject.doc||'').trim()){ dToast('请先生成'+oStageName(stage)+'再进入下一步'); return; }
  if(isLast){ if(!confirm('确认定稿？定稿后项目标记为完成。')) return; }
  dS.oStageBusy=true; dRender();
  if(!isLast) await dOSaveDoc(true);   // 先把手动编辑落库，advance 会快照 project.doc
  const r = await dHttp.post('/original/projects/'+dS.oProject.id+'/stage/advance', {});
  dS.oStageBusy=false;
  if(r.code!==200){ dToast(r.msg||'操作失败'); dRender(); return; }
  if(r.data.done){ dS.oProject.status='final'; dToast('已完成定稿'); dRender(); return; }
  dS.oProject.artifacts = dS.oProject.artifacts || {};
  dS.oProject.artifacts[r.data.prevStage] = dS.oProject.doc || dS.oProject.artifacts[r.data.prevStage] || '';
  dS.oMessages.push({ role:'ai', content:'✓ '+oStageName(r.data.prevStage)+'已确认。进入下一步：'+r.data.tipName+'。' });
  if(r.data.message) dS.oMessages.push(r.data.message);
  dS.oProject.stage = r.data.stage; dS.oProject.doc = r.data.doc; dS.oProject.turns = r.data.turns;
  dS.oRight='doc';
  dRender(); dOScrollChat();
}
async function dOBack(){
  if(dS.oStageBusy || !dS.oProject) return;
  const stage = dS.oProject.stage || 'script';
  if(stage==='direction'){ dToast('已经是第一步'); return; }
  if(!confirm('回到上一步？当前'+oStageName(stage)+'草稿不会进入对标，可重新生成。')) return;
  dS.oStageBusy=true; dRender();
  const r = await dHttp.post('/original/projects/'+dS.oProject.id+'/stage/back', {});
  dS.oStageBusy=false;
  if(r.code!==200){ dToast(r.msg||'操作失败'); dRender(); return; }
  dS.oProject.stage = r.data.stage; dS.oProject.doc = r.data.doc; dS.oProject.status='draft';
  dS.oRight='doc'; dToast('已回到'+oStageName(r.data.stage));
  dRender();
}

async function dOCreateProject(){

  const r = await dHttp.post('/original/projects', {

async function dOMatSaveText(){
  const content = (dS.oMatContent||'').trim();
  if(!content){ dToast('请粘贴原文内容'); return; }
  dS.oMatSaving=true; dRender();
  const r = await dHttp.post('/original/materials', { title:(dS.oMatTitle||'').trim()||null, rawContent:content, sourceType:'text' });

  if(r.code===200){ dS.oMatModal=false; dToast('已保存到素材库'); await dOLoadMaterials(true); }

async function dOMatExtractUrl(){

  dS.oMatUrlLoading=false;
  if(r.code===200 && r.data && r.data.items && r.data.items[0]){

    dS.oMatUrlResult = { title:v.desc||'', script:v.script||'', sourceUrl:url };

/* ===== 从账号批量学习（独立全屏页：输入 → 勾选 → 逐条导入实时状态 → 结果） ===== */
function dOAccOpen(){ dS.oView='accimport'; dS.oAccUrl=''; dS.oAccVideos=null; dS.oAccLoading=false; dS.oAccImporting=false; dS.oAccTotal=0; dRender(); }
async function dOAccFetch(){
  const url = (dS.oAccUrl||'').trim(); if(!url){ dToast('请先粘贴账号主页链接'); return; }
  dS.oAccLoading=true; dS.oAccVideos=null; dRender();
  const r = await dHttp.post('/original/learning/extract', { url, type:'account' });
  dS.oAccLoading=false;
  if(r.code===200 && r.data && r.data.items){
    dS.oAccVideos = r.data.items.map(v=>({ awemeId:v.awemeId, desc:v.desc, likes:v.likes, sel:!!v.selected, status:'idle', chars:0 }));
  } else dToast(r.msg||'拉取失败');
  dRender();
}
function dOAccToggle(id){ if(dS.oAccImporting) return; const v=(dS.oAccVideos||[]).find(x=>x.awemeId===id); if(v) v.sel=!v.sel; dRender(); }
function dOAccSelectAll(on){ if(dS.oAccImporting) return; (dS.oAccVideos||[]).forEach(v=>v.sel=on); dRender(); }
async function dOAccImport(){
  const sel = (dS.oAccVideos||[]).filter(v=>v.sel);
  if(!sel.length || dS.oAccImporting) return;
  dS.oAccImporting=true; dS.oAccTotal=sel.length;
  sel.forEach(v=>{ v.status='idle'; v.chars=0; });
  dRender();
  for(const v of sel){
    v.status='doing'; dRender();
    const vurl = 'https://www.douyin.com/video/'+v.awemeId;
    const ex = await dHttp.post('/original/learning/extract', { url:vurl, type:'video' });
    const it = ex.code===200 && ex.data && ex.data.items && ex.data.items[0];
    if(it && (it.script||'').trim()){
      await dHttp.post('/original/materials', { title:it.desc||v.desc||null, rawContent:it.script, sourceUrl:vurl, sourceType:'video' });
      v.status='done'; v.chars = it.script.replace(/\s/g,'').length;
    } else { v.status='skip'; }
    dRender();
  }
  dS.oAccImporting=false;
  await dOLoadMaterials(true);
  dRender();
}
function dOAccGoLearn(){ dS.oView='learning'; dS.oLearnPhase='input'; dS.oLearnResult=null; dRender(); }
function dOAccountImport(){
  const vids = dS.oAccVideos;
  const selCount = (vids||[]).filter(v=>v.sel).length;
  const doneCount = (vids||[]).filter(v=>v.status==='done').length;
  const skipCount = (vids||[]).filter(v=>v.status==='skip').length;
  const finished = vids && !dS.oAccImporting && (doneCount>0||skipCount>0);
  const ckSvg='<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const fmtLikes=n=>n>=10000?(n/10000).toFixed(1)+'万':(n||0);
  const badge=v=>{
    if(v.status==='doing') return '<span style="font-size:11px;color:#F5762A;font-weight:600">提取中…</span>';
    if(v.status==='done') return `<span style="font-size:11px;color:#16A34A;font-weight:600">✓ 已提取 ${v.chars} 字</span>`;
    if(v.status==='skip') return '<span style="font-size:11px;color:#E5534B">跳过 · 无字幕/转录失败</span>';
    return '<span style="font-size:11px;color:#B0AA9F">待导入</span>';
  };
  const listHtml = vids ? `
    <div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px">
      <div style="font-size:13px;color:#6E6860">共 ${vids.length} 条 · 已选 ${selCount}${(doneCount||skipCount)?` · 已导入 ${doneCount}，跳过 ${skipCount}`:''}</div>
      ${dS.oAccImporting?'':`<div style="display:flex;gap:12px"><span class="do-link" onclick="dOAccSelectAll(true)">全选</span><span class="do-link" onclick="dOAccSelectAll(false)">清空</span></div>`}
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${vids.map(v=>`
        <div class="do-mat-row ${v.sel?'bound':''}" style="align-items:center;${dS.oAccImporting?'':'cursor:pointer'}" ${dS.oAccImporting?'':`onclick="dOAccToggle('${v.awemeId}')"`}>
          <div class="do-mat-check ${v.sel?'on':''}" style="flex-shrink:0">${v.sel?ckSvg:''}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13.5px;color:#1A1614;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(v.desc||'（无标题）')}</div>
            <div style="display:flex;gap:10px;align-items:center;margin-top:3px"><span style="font-size:11px;color:#B0AA9F">${fmtLikes(v.likes)} 赞</span>${badge(v)}</div>
          </div>
        </div>`).join('')}

async function dOLearnAnalyze(){
  const sel = dS.oMatSel || [];
  if(!sel.length || dS.oLearnBusy) return;
  dS.oLearnBusy=true; dS.oLearnResult=null; dRender();
  const r = await dHttp.post('/original/learning/analyze', { materialIds:sel, scope:dS.oLearnScope });
  if(r.code!==200 || !r.data || !r.data.taskId){ dS.oLearnBusy=false; dToast(r.msg||'提交失败'); dRender(); return; }
  // 异步轮询（逐条深拆很慢，避免网关超时）
  const timer = setInterval(async ()=>{
    const t = await dHttp.get('/tasks/'+r.data.taskId);
    if(t.code!==200 || !t.data) return;
    if(t.data.status==='done'){
      clearInterval(timer); dS.oLearnBusy=false;
      const data = t.data.result || {};
      data.rules = (data.rules||[]).map(rule=>({ ...rule, checked: rule.checked!==false }));
      dS.oLearnResult = data; dS.oLearnPhase='result'; dRender();
    } else if(t.data.status==='failed'){
      clearInterval(timer); dS.oLearnBusy=false;
      dToast('拆解失败：'+(t.data.error_msg||'请重试')); dRender();
    }
  }, 3000);
}

async function dOLearnWrite(){
  if(dS.oLearnWriting) return;
  const result = dS.oLearnResult;
  const selected = (result&&Array.isArray(result.rules))?result.rules.filter(r=>r.checked):[];
  if(!selected.length){ dToast('请至少勾选一条规律'); return; }
  const scope = dS.oLearnScope||'global';
  dS.oLearnWriting=true; dRender();
  const projectId = scope==='project' && dS.oProject ? dS.oProject.id : null;
  const n = selected.length;
  // 提取金句样本（逐句标注里 hook/turn/cta 的原句，传语感不传内容）
  const roleMap = { hook:'hook', turn:'turn', cta:'end' };
  const samples = [];
  (result.videos||[]).forEach(v=>{ (v.segments||[]).forEach(seg=>{
    const st = roleMap[seg.role]; const t = (seg.text||'').trim();
    if(st && t.length>=4 && t.length<=60) samples.push({ stage:st, text:t });
  }); });
  const r = await dHttp.post('/original/learning/write', { insights:selected.map(s=>({text:s.text,dim:s.dim,freq:s.freq})), scope, projectId, samples });
  if(r.code!==200){ dS.oLearnWriting=false; dToast(r.msg||'写入失败'); dRender(); return; }
  const finish = () => {
    dS.oLearnWriting=false; dS.oSkill=null; // 让 Skill 下次重新加载最新
    const base = scope==='global'?`已融合 ${n} 项进 Skill ✓`:`已记录 ${n} 项`;
    dToast(samples.length ? `${base}，并收录 ${samples.length} 条神句到语感金句库` : base);
    dS.oLearnResult=null; dS.oLearnPhase='input'; dS.oMatSel=[]; dS.oLoaded=false; dS.oView='home';
    dRender();
  };
  if(r.data && r.data.taskId){
    // global 异步融合：轮询（AI 重组工作流较慢）
    const timer = setInterval(async ()=>{
      const t = await dHttp.get('/tasks/'+r.data.taskId);
      if(t.code!==200 || !t.data) return;
      if(t.data.status==='done'){ clearInterval(timer); finish(); }
      else if(t.data.status==='failed'){ clearInterval(timer); dS.oLearnWriting=false; dToast('写入失败：'+(t.data.error_msg||'请重试')); dRender(); }
    }, 3000);
  } else { finish(); } // project 同步已完成
}

   Skill 自由编辑页（全屏）
   ============================================================ */
/* ── 多 Skill 辅助 ── */
function dOGetSkillList(){
  if(dS.oSkillList) return dS.oSkillList;
  // 主 Skill（后端）
  const main = {
    id:'main', name:'主 Skill',
    version: dS.oSkill?(dS.oSkill.version||'v1.0'):'v1.0',
    content: (dS.oSkill&&dS.oSkill.freeText)||'',
    updatedAt: dS.oSkill&&dS.oSkill.updated_at ? dFmtTime(dS.oSkill.updated_at) : '—',
  };
  // 题材包（后端，写作时按项目挂载注入）
  const packs = (dS.oPacks||[]).map(pk=>({
    id:'pack_'+pk.id, packId:pk.id, name:pk.name||'未命名题材包',
    version:'题材包', content:pk.content||'',
    updatedAt: pk.updated_at ? dFmtTime(pk.updated_at) : '—',
  }));
  // 从 localStorage 加载旧版本地 Skills（历史兼容，仅本地不生效）
  let extra = [];
  try { extra = JSON.parse(localStorage.getItem('wf_extra_skills')||'[]'); } catch{}
  dS.oSkillList = [main, ...packs, ...extra];
  return dS.oSkillList;
}
function dOGetCurSkill(){
  const list = dOGetSkillList();
  return list.find(s=>s.id===dS.oSkillCurId) || list[0];
}
function dOSaveExtraSkills(){
  const list = dOGetSkillList();
  const extra = list.filter(s=>s.id!=='main');
  localStorage.setItem('wf_extra_skills', JSON.stringify(extra));
}
function dOSkillAddNew(){
  const id = 'sk_'+Date.now();
  const list = dOGetSkillList();
  list.push({ id, name:'新 Skill', version:'v1.0', content:'## 开场规则\n- \n\n## 结构规则\n- ', updatedAt:'刚刚' });
  dS.oSkillList = list;
  dOSaveExtraSkills();
  dS.oSkillCurId = id;
  dS.oSkillDraft = '## 开场规则\n- \n\n## 结构规则\n- ';
  dRender();
}
function dOSkillSelect(id){
  if(dS.oSkillCurId===id) return;
  dS.oSkillCurId = id;
  dS.oSkillDraft = null;
  dS.oSkillEditMode = false;
  dRender();
}
function dOSkillEnterEdit(){
  const cur = dOGetCurSkill();
  dS.oSkillDraft = dS.oSkillDraft!==null ? dS.oSkillDraft : (cur.content||'');
  dS.oSkillEditMode = true;
  dRender();
}

function dOSkillPage(){
  if(!dS.oPacksLoaded){ dS.oPacksLoaded = true; dOLoadPacks(); }
  const list = dOGetSkillList();
  const cur = dOGetCurSkill();
  const isPack = String(cur.id).indexOf('pack_')===0;
  const isEditMode = dS.oSkillEditMode===true;
  // 阅读模式展示 cur.content（已保存内容）；编辑模式展示 draft（草稿）
  const savedContent = cur.content||'';
  const editDraft = dS.oSkillDraft!==null ? dS.oSkillDraft : savedContent;
  const history = (cur.id==='main' && dS.oSkill&&dS.oSkill.freeTextHistory)||[];
  const sk = dS.oSkill;
  const ruleCount = (savedContent.match(/^- /mg)||[]).length;
  const kwCount = sk ? (sk.keywords||[]).length : 0;
  const fbCount = sk ? (sk.forbidden||[]).length : 0;
  const ver = cur.version||'v1.0';

  const historySheet = dS.oSkillHistoryOpen?`
    <div class="d-modal-overlay" style="display:flex" onclick="if(event.target===this){dS.oSkillHistoryOpen=false;dRender();}">
      <div class="d-modal" style="max-width:520px;text-align:left;max-height:70vh;overflow:hidden;display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div class="d-modal-title" style="margin:0">历史记录</div><button style="background:none;border:none;font-size:24px;color:#B0AA9F;cursor:pointer;line-height:1" onclick="dS.oSkillHistoryOpen=false;dRender()">×</button></div>
        <div style="overflow-y:auto;flex:1">
          ${history.length===0?`<div class="do-empty">暂无历史记录。每次保存前的内容会自动存档。</div>`:history.map((h,i)=>{
            const d=new Date(h.savedAt); const label=`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const preview=(h.text||'').replace(/\n/g,' ').slice(0,70);
            return `<div onclick="dOSkillRestore(${i})" class="hov-hist-item" style="padding:12px 14px;cursor:pointer;border-bottom:1px solid #F2EFEA;border-radius:8px">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;font-weight:600;color:#1A1614">${label}</span><span style="font-size:12px;color:#F5602A;font-weight:600">还原</span></div>
              <div style="font-size:12px;color:#9E9890;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(preview)||'（空）'}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`:'';

  /* 左侧栏：Skill 列表 */
  const sidebar = `
    <div style="width:200px;flex-shrink:0;background:#F7F5F1;border-right:1px solid #EDE9E3;display:flex;flex-direction:column;overflow:hidden;min-height:calc(100vh - 180px)">
      <div style="padding:16px 14px 10px;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <div onclick="dOBackHome()" class="hov-back-btn" style="width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6E6860;transition:all .15s">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span style="font-size:12px;font-weight:700;color:#9E9890;letter-spacing:0.3px">我的 Skill</span>
        </div>
        <button onclick="dOOpenPackEdit(null)" class="hov-add-skill" style="width:100%;padding:7px 0;border-radius:8px;border:1.5px dashed #D8D2C9;background:transparent;color:#9E9890;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          新建题材包
        </button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:3px">
        ${list.map(s=>`
          <div onclick="dOSkillSelect('${s.id}')" class="hov-skill-item ${dS.oSkillCurId===s.id?'hov-skill-item-on':''}" style="padding:10px;border-radius:9px;cursor:pointer;box-shadow:${dS.oSkillCurId===s.id?'0 1px 6px rgba(0,0,0,0.07)':'none'};transition:all .15s">
            <div style="font-size:13px;font-weight:${dS.oSkillCurId===s.id?700:500};color:${dS.oSkillCurId===s.id?'#1A1614':'#6E6860'};margin-bottom:3px">${esc(s.name)}</div>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:10.5px;color:#F5762A;font-weight:600;background:#FFF3E8;padding:1px 6px;border-radius:4px">${esc(s.version)}</span>
              <span style="font-size:10.5px;color:#B0AA9F">${esc(s.updatedAt||'—')}</span>
            </div>
          </div>`).join('')}
      </div>
    </div>`;

  /* 右侧内容区 */
  const topBar = `
    <div style="padding:13px 20px;border-bottom:1px solid #F0EDE8;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0;background:#fff">
      <div style="min-width:0;flex:1">
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:0">
          <span style="font-size:15px;font-weight:700;color:#1A1614;margin-right:7px">${esc(cur.name)}</span>
          <span style="font-size:11px;color:#F5762A;font-weight:600;background:#FFF3E8;padding:1px 7px;border-radius:5px;margin-right:8px">${esc(ver)}</span>
          ${isPack
            ? `<span style="font-size:11px;color:#B0AA9F">· Markdown · 在项目简介里挂载到项目后，写作时注入（优先级高于全局 Skill） · </span><span style="font-size:11px;color:#F5762A;font-weight:600;margin-left:3px">${ruleCount}条规则</span>`
            : `<span style="font-size:11px;color:#B0AA9F">· Markdown · AI写作时自动遵循 · </span>
          <span style="font-size:11px;color:#F5762A;font-weight:600;margin-left:3px">${ruleCount}条规则</span>
          <span style="font-size:11px;color:#B0AA9F"> · 高频词${kwCount} · 禁区${fbCount}</span>`}
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        ${cur.id==='main'?`<button class="do-btn do-btn-gho" onclick="dOOpenStats()">效果数据</button>`:''}
        ${cur.id==='main'?`<button class="do-btn do-btn-gho" onclick="dOOpenSamples()">语感金句</button>`:''}
        ${cur.id==='main'?`<button class="do-btn do-btn-gho" ${dS.oCompacting?'disabled':''} onclick="dOCompactSkill()">${dS.oCompacting?'整理中…':'整理自动学习记录'}</button>`:''}
        ${cur.id==='main'?`<button class="do-btn do-btn-gho" onclick="dS.oSkillHistoryOpen=true;dRender()">历史记录</button>`:''}
        ${isPack?`<button class="do-btn" style="background:#FFF0EF;color:#E5534B" onclick="dODeletePackById(${cur.packId})">删除此包</button>`:''}
        ${isEditMode
          ? `<button class="do-btn do-btn-gho" style="color:#9E9890" onclick="dS.oSkillEditMode=false;dS.oSkillDraft=null;dRender()">取消</button>
             <button class="do-btn do-btn-pri" ${dS.oSkillSaving?'disabled':''} onclick="dOSkillSave()">${dS.oSkillSaving?'保存中…':'保存'}</button>`
          : `<button class="do-btn do-btn-pri" onclick="dOSkillEnterEdit()">编辑</button>`
        }
      </div>
    </div>`;

  const contentArea = isEditMode
    ? `<textarea class="do-input" style="flex:1;min-height:300px;resize:none;line-height:1.85;font-size:14px;padding:20px;border:none;border-radius:0;outline:none;box-shadow:none"
        placeholder="自由写，支持 Markdown 格式：&#10;&#10;## 开场钩子&#10;- 用数字+反差做开头&#10;- 前3秒必须抓住用户&#10;&#10;## 禁区&#10;- 不讲技术原理"
        oninput="dS.oSkillDraft=this.value">${esc(editDraft)}</textarea>`
    : `<div style="flex:1;overflow-y:auto;padding:22px 26px">${dOMarkdownHtml(savedContent)}</div>`;

  const editor = `
    <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:#fff">
      ${topBar}
      ${contentArea}
    </div>`;

  return `
    <div style="display:flex;height:calc(100vh - 120px);border-radius:16px;overflow:hidden;border:1px solid #EFEAE2;box-shadow:0 2px 16px rgba(0,0,0,0.06)">
      ${sidebar}${editor}
    </div>
    ${historySheet}${dS.oStatsOpen?dOStatsModalHtml():''}${dS.oPackEdit?dOPackModalHtml():''}${dS.oSamplesModal?dOSamplesModalHtml():''}`;
}
async function dOSkillSave(){
  if(dS.oSkillSaving) return;
  const cur = dOGetCurSkill();
  const text = dS.oSkillDraft!==null ? dS.oSkillDraft : (cur.content||'');
  dS.oSkillSaving=true; dRender();
  if(cur.id==='main'){
    // 主 Skill → 同步后端
    const r = await dHttp.put('/original/skill', { freeText:text });
    dS.oSkillSaving=false;
    if(r.code===200){
      dS.oSkill=r.data;
      // 同步更新 list 里的 main，并返回阅读模式
      if(dS.oSkillList){ const m=dS.oSkillList.find(s=>s.id==='main'); if(m){ m.content=text; m.updatedAt='刚刚'; } }
      dS.oSkillDraft=null; dS.oSkillEditMode=false;
      dToast('已保存 ✓');
    } else dToast(r.msg||'保存失败');
  } else if(String(cur.id).indexOf('pack_')===0){
    // 题材包 → 同步后端（名称不变，只存内容）
    const r = await dApi('PUT','/original/packs/'+cur.packId, { name: cur.name, content: text });
    dS.oSkillSaving=false;
    if(r.code===200){
      if(dS.oSkillList){ const s=dS.oSkillList.find(s=>s.id===cur.id); if(s){ s.content=text; s.updatedAt='刚刚'; } }
      const pk=(dS.oPacks||[]).find(x=>x.id===cur.packId); if(pk) pk.content=text;
      dS.oSkillDraft=null; dS.oSkillEditMode=false;
      dToast('已保存 ✓');
    } else dToast(r.msg||'保存失败');
  } else {
    // 旧版本地 Skill → 仅本地，保存后返回阅读模式
    if(dS.oSkillList){ const s=dS.oSkillList.find(s=>s.id===cur.id); if(s){ s.content=text; s.updatedAt='刚刚'; } }
    dOSaveExtraSkills();
    dS.oSkillSaving=false;
    dS.oSkillDraft=null; dS.oSkillEditMode=false;
    dToast('已保存（本地）✓');
  }
  dRender();
}
function dOSkillRestore(idx){
  const history = (dS.oSkill&&dS.oSkill.freeTextHistory)||[];
  const entry = history[idx];
  if(!entry) return;
  dS.oSkillDraft = entry.text; dS.oSkillHistoryOpen=false; dS.oSkillEditMode=true;
  dToast('已还原，记得点保存'); dRender();
}

/* ---------- 工作台内：快速记 Skill ---------- */
function dOQuickModalHtml(){
  return `<div class="d-modal-overlay" style="display:flex" onclick="if(event.target===this)dOQuickClose()">
    <div class="d-modal" style="max-width:480px;text-align:left">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div class="d-modal-title" style="margin:0">记一条 Skill</div><button style="background:none;border:none;font-size:24px;color:#B0AA9F;cursor:pointer;line-height:1" onclick="dOQuickClose()">×</button></div>
      <div class="d-modal-sub">随手记下创作心得，追加到 Skill 自由笔记末尾</div>
      <textarea class="do-input" rows="4" style="resize:vertical;line-height:1.7" placeholder="例如：开头先抛一个反常识结论，再用一个数字佐证…" oninput="dS.oSkillQuickText=this.value">${esc(dS.oSkillQuickText)}</textarea>
      <button class="do-btn do-btn-pri" style="width:100%;margin-top:14px;padding:11px" ${dS.oSkillQuickSaving?'disabled':''} onclick="dOQuickSave()">${dS.oSkillQuickSaving?'保存中…':'记入 Skill'}</button>
    </div>
  </div>`;
}
function dOQuickOpen(){ dS.oSkillQuickModal=true; dS.oSkillQuickText=''; dRender(); }
function dOQuickClose(){ dS.oSkillQuickModal=false; dRender(); }
async function dOQuickSave(){
  const text = (dS.oSkillQuickText||'').trim();
  if(!text){ dToast('请输入内容'); return; }
  dS.oSkillQuickSaving=true; dRender();
  const existing = (dS.oSkill&&dS.oSkill.freeText)||'';
  const newFree = existing + (existing.trim()?'\n\n':'') + text;
  const r = await dHttp.put('/original/skill', { freeText:newFree });
  dS.oSkillQuickSaving=false;
  if(r.code===200){ dS.oSkill=r.data; dS.oSkillDraft=null; dS.oSkillQuickModal=false; dToast('已记入 Skill ✓'); }
  else dToast(r.msg||'保存失败');
  dRender();
}
</script>
